name: Scanner isolated review checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests hypothesis pydantic openai azure-identity playwright
      - name: Install public suffix test fixture
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/publicsuffix/list/3929462652695bad04f0a27afb600974014a3c8b/public_suffix_list.dat --output scanner/public_suffix_list.dat
          echo '2919eb9803c91a3f73a507cc6fedc934de005543c22c4016f72e3343de5dd6e7  scanner/public_suffix_list.dat' | sha256sum --check
      - name: Run regression suite
        working-directory: scanner
        run: python -m unittest test_authority test_authority_batch test_commerce_capture test_catalogue_audit test_coderabbit_hardening test_coderabbit_audit_pairs test_coderabbit_policy_gates test_coderabbit_manifest_resume test_deferred_coordinator test_pipeline.PipelineTest.test_large_catalogue_http_throughput_and_write_bound -q
